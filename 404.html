<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found</title>
<style>
  :root { --bg: #fbfbf9; --fg: #1b1d22; --muted: #5d6370; --accent: #1e3a66; }
  @media (prefers-color-scheme: dark) { :root { --bg: #15171b; --fg: #e8e9ec; --muted: #a2a8b4; --accent: #8fb3ee; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
  main { max-width: 44rem; margin: 0 auto; padding: 4rem 1rem; }
  a { color: var(--accent); }
  p { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Page not found</h1>
  <p>This page has moved or no longer exists. <a href="/">Go to the home page</a>.</p>
</main>
</body>
</html>
